<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TALK AFRICA — Traduction</title>
  <style>
    body {
      width: 270px;
      margin: 0;
      padding: 18px;
      background: #fff;
      color: #374151;
      font-family: 'Inter', system-ui, sans-serif;
    }
    h1 {
      margin: 0 0 18px;
      color: #312e81;
      font-size: 16px;
      font-weight: 650;
      text-align: left;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .setting-label {
      display: block;
      margin: 14px 0 6px;
      color: #4b5563;
      font-size: 12px;
      font-weight: 600;
    }
    select {
      box-sizing: border-box;
      width: 100%;
      margin-bottom: 4px;
      padding: 9px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      background: #fff;
      color: #374151;
      font: inherit;
    }
    .status {
      min-height: 1.3em;
      color: #555;
      font-size: 11px;
      text-align: center;
    }
    .status[data-error="true"] { color: #a32121; }
  </style>
</head>
<body>
  <h1>🛡️ TALK AFRICA — Traduction</h1>

  <label for="enabled">
    <input type="checkbox" id="enabled">
    Activer sur les pages web
  </label>

  <label class="setting-label" for="sourceLang">Langue source</label>
  <select id="sourceLang">
    <option value="auto">Détection automatique</option>
    <option value="fr">Français</option>
    <option value="en">Anglais</option>
  </select>

  <label class="setting-label" for="lang">Langue de traduction</label>
  <select id="lang">
    <option value="ewondo">Ewondo</option>
    <option value="fulfulde">Fulfulde</option>
  </select>

  <label class="setting-label" for="displayMode">Mode d’affichage</label>
  <select id="displayMode">
    <option value="overlay">Superposition (Original + Traduction)</option>
    <option value="replace">Remplacement (Traduction seule)</option>
  </select>

  <div class="status" id="status" role="status" aria-live="polite">Chargement…</div>
  <script src="popup.js"></script>
</body>
</html>
